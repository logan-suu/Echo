# ==========================================
# 文件: .swiftlint.yml
# 对应规格: AGENTS.md §9.3 (CI 门禁清单)
# 任务: 1.7 - 搭建 CI（GitHub Actions）
# 架构约束: Swift 6, iOS 18+, Actor Isolation
# 生成时间: 2026-07-05
# ==========================================

# ── 分析范围 ──────────────────────────────────
included:
  - App
  - Core
  - UI
  - EchoTests
  - EchoUITests

excluded:
  - .build
  - DerivedData
  - Packages
  - Echo/Resources/Models
  - .omo
  - .codex
  - .codegraph

# ── Analyzer rules (require swiftlint analyze, run separately) ──
analyzer_rules:
  - capture_variable
  - unused_import
  - unused_declaration

# ── Disabled rules (conflict with project conventions) ──
disabled_rules:
  - trailing_whitespace
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting
  - identifier_name
  - type_name
  - force_cast
  - large_tuple
  - no_fallthrough_only
  - todo
  - multiple_closures_with_trailing_closure
  - for_where

# ── Opt-in rules ──────────────────────────────
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - convenience_type
  - discouraged_assert
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - empty_xctest_method
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicit_return
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - nslocalizedstring_key
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - required_deinit
  - shorthand_optional_binding
  - sorted_first_last
  - static_operator
  - toggle_bool
  - trailing_closure
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - untyped_error_in_catch
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - yoda_condition

# ── Rule configuration ────────────────────────
force_unwrapping:
  severity: warning

force_try:
  severity: warning

trailing_comma:
  mandatory_comma: true

opening_brace:
  severity: error

closing_brace:
  severity: error

colon:
  severity: error
  flexible_right_spacing: false
  apply_to_dictionaries: true

comma:
  severity: error

control_statement:
  severity: error

implicit_optional_initialization:
  severity: error

vertical_whitespace:
  severity: warning
  max_empty_lines: 2

mark:
  severity: warning

orphaned_doc_comment:
  severity: warning

# ── Custom rules ──────────────────────────────
custom_rules:
  no_combine_import:
    name: "No Combine Import"
    regex: "^import Combine"
    message: "Combine is prohibited per R-007. Use Swift Concurrency."
    severity: error
    match_kinds: keyword

  no_unchecked_sendable:
    name: "No @unchecked Sendable"
    regex: '@unchecked\s+Sendable'
    message: "@unchecked Sendable is prohibited per R-007."
    severity: error
    excluded: "EchoTests/.*|EchoUITests/.*"

  no_nontisolated_unsafe:
    name: "No nonisolated(unsafe)"
    regex: 'nonisolated\(unsafe\)'
    message: "nonisolated(unsafe) is prohibited per R-007."
    severity: error

  no_task_detached:
    name: "No Task.detached"
    regex: 'Task\.detached\s*\{'
    message: "Task.detached is prohibited per AGENTS.md §11.4."
    severity: error

  no_print_or_nslog:
    name: "No print() or NSLog()"
    regex: '\b(print|NSLog)\(.+\)'
    message: "print() and NSLog() are prohibited. Use unified logging."
    severity: error
    excluded: "EchoTests/.*|EchoUITests/.*"
